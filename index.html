<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Echo Demo App</title>
  
  <!-- PWA Configuration -->
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  
  <!-- Styles -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Main Home Screen Content -->
  <main>
    <h1>Echo Demo</h1>
    <p class="sub">GitHub Pages → Worker → Apps Script</p>
    
    <!-- Button to trigger the form popup -->
    <button id="openPopupBtn">Open Form</button>
  </main>

  <!-- The Popup Form (Modal) -->
  <!-- 'hidden' class is applied by default -->
  <div id="popupOverlay" class="hidden">
    <div class="modal-content">
      <button id="closePopupBtn" class="close-btn" type="button">&times;</button>
      
      <h2>Fill the Form</h2>
      <p class="sub" style="margin-bottom: 1rem; font-size: 0.85rem;">Your progress is saved automatically.</p>
      
      <form id="echoForm">
        <label>Name
          <input type="text" id="name" placeholder="Ada" required />
        </label>
        <label>Message
          <input type="text" id="message" placeholder="Hello, world!" required />
        </label>
        <button type="submit" id="submitBtn">Send</button>
      </form>
      
      <!-- Output area for the JSON response -->
      <pre id="output">Awaiting request…</pre>
    </div>
  </div>

  <!-- Scripts -->
  <script src="app.js"></script>
  
  <!-- Register Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js')
          .then(reg => console.log('Service Worker registered!', reg))
          .catch(err => console.log('Service Worker registration failed:', err));
      });
    }
  </script>
</body>
</html>
